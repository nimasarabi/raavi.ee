title:
  en: "Tell me about your project."
  et: "Räägi oma projektist."
body:
  en: "Share a few details and I'll reply with availability, questions and a clear plan. Tell me the date, location, type of event or product, and roughly how many hours you need. I usually reply within 1–2 business days."
  et: "Kirjelda lühidalt vajadusi ja vastan saadavuse, küsimuste ning selge plaaniga. Anna teada kuupäev, asukoht, ürituse või toote tüüp ning umbkaudne tundide arv. Vastan tavaliselt 1–2 tööpäeva jooksul."

