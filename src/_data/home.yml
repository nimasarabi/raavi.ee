about:
  eyebrow:
    en: "About"
    et: "Minust"
  heading:
    en: "Quietly focused, attentive to the details that matter."
    et: "Vaikselt fokuseeritud, tähelepanelik oluliste detailide suhtes."
  body:
    en: |
      I'm Nima Sarabi, a photographer based in Tartu and working across
      Estonia. I focus on event, product and food photography — clear,
      direct images that help clients show their work at its best.

      My approach is straightforward. I work quietly, stay focused, and
      pay attention to the details that matter.

      I come from a design and model-making background, where accuracy
      and clarity matter. That work trains you to notice the small things,
      and I bring the same discipline into my photography. Clean
      composition, controlled light, honest documentation.
    et: |
      Olen Nima Sarabi, Tartus tegutsev fotograaf, kes töötab üle Eesti.
      Keskendun ürituste, toodete ja toidu pildistamisele, luues selgeid
      ja otseseid pilte, mis aitavad klientidel oma töid parimal moel
      esitleda.

      Minu lähenemine on lihtne. Töötan vaikselt, hoian fookust ja
      pööran tähelepanu olulistele detailidele.

      Mul on disaini ja maketitegemise taust, kus täpsus ja selgus on
      olulised. See töö õpetab märkama väikseid asju ning kannan sama
      distsipliini oma fotograafiasse. Puhas kompositsioon, kontrollitud
      valgus ja aus dokumenteerimine.
  image: "/assets/img/home/20251119_Nima+Sarabi__DSC6669.webp"
  alt:
    en: "Portrait of Nima Sarabi, photographer based in Tartu, Estonia."
    et: "Nima Sarabi, Tartus tegutsev fotograaf."

