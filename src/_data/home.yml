about:
  eyebrow:
    en: "About"
    et: "Minust"
  heading:
    en: "An eye for stillness, a feel for the moment."
    et: "Silm pilgu jaoks, käsi hetke jaoks."
  body:
    en: |
      I'm Nima Sarabi, a photographer based in Tallinn. I work with restaurants,
      product brands and event organisers who care about how their work is seen —
      not just shown.

      My approach is patient and minimal. Natural light when it serves the story,
      careful staging when it doesn't. The aim is always the same: an image that
      feels true to its subject and quietly memorable.
    et: |
      Olen Nima Sarabi, Tallinnas tegutsev fotograaf. Töötan restoranide,
      tootebrändide ja sündmuste korraldajatega, kelle jaoks loeb mitte ainult
      see, et neid nähakse — vaid kuidas neid nähakse.

      Pildistan rahulikult ja minimalistlikult. Loomulik valgus, kui see lugu
      kannab, hoolikas seadistus, kui mitte. Eesmärk on alati sama: kaader, mis
      on truu oma teemale ja jääb vaikselt meelde.
  image: "/assets/img/services/20231217_1.webp"
  alt:
    en: "A muted portrait — Nima at work."
    et: "Tagasihoidlik portree — Nima töö juures."

