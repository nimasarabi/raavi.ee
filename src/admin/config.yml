# DecapBridge PKCE auth (Sveltia uses 'github' backend, not 'git-gateway')
backend:
  name: github
  repo: nimasarabi/raavi.ee
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2be5afb0-fe4e-4c2b-8f69-903e15a75933/pkce
  auth_token_endpoint: /sites/2be5afb0-fe4e-4c2b-8f69-903e15a75933/token

  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

site_url: https://nimasarabi.netlify.app
display_url: https://nimasarabi.netlify.app
locale: "en"

# Reusable bilingual widget. Used as a partial via YAML anchors below.
# Each translatable concept becomes an Object widget with EN + ET sub-fields.

collections:
  - name: site
    label: "Site settings"
    files:
      - file: "src/_data/site.yml"
        label: "Brand & contact"
        name: settings
        fields:
          - label: "Brand"
            name: brand
            widget: object
            collapsed: true
            fields:
              - { label: "Display name", name: name, widget: string }
              - { label: "Highlighted word", name: accent_word, widget: string, hint: "Part shown in accent color, e.g. 'Sarabi' inside 'Nima Sarabi'" }
              - { label: "Legal entity", name: legal, widget: string }
          - label: "Contact"
            name: contact
            widget: object
            fields:
              - { label: "Email", name: email, widget: string }
              - { label: "Phone", name: phone, widget: string, required: false }
              - { label: "Instagram handle", name: instagram_handle, widget: string, required: false }
              - { label: "Instagram URL", name: instagram_url, widget: string, required: false }
              - { label: "TikTok URL", name: tiktok_url, widget: string, required: false }
              - { label: "Facebook URL", name: facebook_url, widget: string, required: false }
              - { label: "City", name: city, widget: string }
              - label: "Country"
                name: country
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }

  - name: home
    label: "Home page"
    files:
      - file: "src/_data/home.yml"
        label: "Home page"
        name: home
        fields:
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - label: "Eyebrow"
                name: eyebrow
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }
              - label: "Title"
                name: title
                widget: object
                hint: "You can wrap a word in <em>...</em> to italicise it in the accent color."
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }
              - label: "Subtitle"
                name: sub
                widget: object
                fields:
                  - { label: "English", name: en, widget: text }
                  - { label: "Estonian", name: et, widget: text }
              - label: "Primary CTA"
                name: cta_primary
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }
              - label: "Secondary CTA"
                name: cta_secondary
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }
              - { label: "Hero image", name: image, widget: image }
              - label: "Image alt text"
                name: alt
                widget: object
                required: false
                fields:
                  - { label: "English", name: en, widget: string, required: false }
                  - { label: "Estonian", name: et, widget: string, required: false }
          - label: "About"
            name: about
            widget: object
            fields:
              - label: "Eyebrow"
                name: eyebrow
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }
              - label: "Heading"
                name: heading
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }
              - label: "Body"
                name: body
                widget: object
                fields:
                  - { label: "English", name: en, widget: text }
                  - { label: "Estonian", name: et, widget: text }
              - { label: "Portrait", name: image, widget: image }
              - label: "Image alt text"
                name: alt
                widget: object
                required: false
                fields:
                  - { label: "English", name: en, widget: string, required: false }
                  - { label: "Estonian", name: et, widget: string, required: false }
          - label: "Category cards"
            name: categories
            widget: object
            fields:
              - label: "Food & Product"
                name: product
                widget: object
                fields:
                  - label: "Label"
                    name: label
                    widget: object
                    fields:
                      - { label: "English", name: en, widget: string }
                      - { label: "Estonian", name: et, widget: string }
                  - label: "Title"
                    name: title
                    widget: object
                    fields:
                      - { label: "English", name: en, widget: string }
                      - { label: "Estonian", name: et, widget: string }
                  - label: "Arrow text"
                    name: arrow
                    widget: object
                    fields:
                      - { label: "English", name: en, widget: string }
                      - { label: "Estonian", name: et, widget: string }
                  - { label: "Image", name: image, widget: image }
              - label: "Events"
                name: events
                widget: object
                fields:
                  - label: "Label"
                    name: label
                    widget: object
                    fields:
                      - { label: "English", name: en, widget: string }
                      - { label: "Estonian", name: et, widget: string }
                  - label: "Title"
                    name: title
                    widget: object
                    fields:
                      - { label: "English", name: en, widget: string }
                      - { label: "Estonian", name: et, widget: string }
                  - label: "Arrow text"
                    name: arrow
                    widget: object
                    fields:
                      - { label: "English", name: en, widget: string }
                      - { label: "Estonian", name: et, widget: string }
                  - { label: "Image", name: image, widget: image }

  - name: portfolio
    label: "Portfolio items"
    folder: "src/_portfolio"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{fields.title_en}} ({{fields.category}})"
    fields:
      - { label: "Title (English)", name: title_en, widget: string, required: false }
      - { label: "Title (Estonian)", name: title_et, widget: string, required: false }
      - { label: "Category", name: category, widget: select, options: ["product", "events"] }
      - { label: "Image", name: image, widget: image }
      - { label: "Sort order", name: order, widget: number, required: false, hint: "Lower = earlier in the grid. Product items use 1–99, events 100+." }
      - { label: "Body (optional)", name: body, widget: markdown, required: false }

  - name: prices
    label: "Services / Prices page"
    files:
      - file: "src/_data/prices.yml"
        label: "Services / Prices"
        name: prices
        fields:
          - label: "Page title"
            name: title
            widget: object
            fields:
              - { label: "English", name: en, widget: string }
              - { label: "Estonian", name: et, widget: string }
          - label: "Intro text"
            name: sub
            widget: object
            fields:
              - { label: "English", name: en, widget: text }
              - { label: "Estonian", name: et, widget: text }
          - label: "Sections"
            name: sections
            widget: list
            summary: "{{fields.title.en}}"
            fields:
              - { label: "ID (slug)", name: id, widget: string }
              - label: "Section title"
                name: title
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }
              - label: "Section description"
                name: sub
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }
              - label: "Rows"
                name: rows
                widget: list
                summary: "{{fields.name.en}} — {{fields.amount}}"
                fields:
                  - label: "Item name"
                    name: name
                    widget: object
                    fields:
                      - { label: "English", name: en, widget: string }
                      - { label: "Estonian", name: et, widget: string }
                  - label: "Description"
                    name: desc
                    widget: object
                    fields:
                      - { label: "English", name: en, widget: string }
                      - { label: "Estonian", name: et, widget: string }
                  - { label: "Amount", name: amount, widget: string, hint: "e.g. €450 or 'From €1,200' or 'Included'" }
              - label: "Footnote"
                name: note
                widget: object
                required: false
                fields:
                  - { label: "English", name: en, widget: text, required: false }
                  - { label: "Estonian", name: et, widget: text, required: false }
          - label: "Closing CTA"
            name: cta
            widget: object
            fields:
              - label: "Text"
                name: text
                widget: object
                fields:
                  - { label: "English", name: en, widget: text }
                  - { label: "Estonian", name: et, widget: text }
              - label: "Button label"
                name: button
                widget: object
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "Estonian", name: et, widget: string }

  - name: contact
    label: "Contact page"
    files:
      - file: "src/_data/contact.yml"
        label: "Contact page"
        name: contact
        fields:
          - label: "Page title"
            name: title
            widget: object
            fields:
              - { label: "English", name: en, widget: string }
              - { label: "Estonian", name: et, widget: string }
          - label: "Intro body"
            name: body
            widget: object
            fields:
              - { label: "English", name: en, widget: text }
              - { label: "Estonian", name: et, widget: text }
